[project]
name = "risk-intel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akash Thorat", email = "aakashthorat303@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.51.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
risk-intel = "risk_intel.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
